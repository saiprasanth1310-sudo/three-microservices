services:
  service1:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./service1:/usr/share/nginx/html

  service2:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./service2:/usr/share/nginx/html

  service3:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./service3:/usr/share/nginx/html
  proxy:
    image: nginx:alpine
    ports:
      - "8084:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service1
      - service2
      - service3
