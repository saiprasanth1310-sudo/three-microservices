server {
    listen 80;

    location = / {
        return 200 "Three Microservices Application is Running!";
        add_header Content-Type text/plain;
    }

    location /service1/ {
        proxy_pass http://service1/;
    }

    location /service2/ {
        proxy_pass http://service2/;
    }

    location /service3/ {
        proxy_pass http://service3/;
    }
}
